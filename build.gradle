plugins {
    id 'groovy'
    id 'application'
}

ext {
    groovyVersion = '4.0.29'
    spockVersion = '2.4-groovy-4.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.groovy:groovy:${groovyVersion}"
    implementation "org.apache.groovy:groovy-json:${groovyVersion}"

    testImplementation "org.spockframework:spock-core:${spockVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.example.satellite.SatelliteControlCenter'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('checkVersions') {
    group = 'Help'
    description = 'Checks key versions and saves them to a file.'
    doLast {
        def output = """
        Gradle version: ${gradle.gradleVersion}
        Spock version: ${spockVersion}
        Groovy version: ${groovyVersion}
        Java toolchain version: ${java.toolchain.languageVersion.get()}
        Gradle runtime Java version: ${System.getProperty('java.version')}
        """.stripIndent().trim()
        def outputFile = layout.buildDirectory.file('system-info.txt').get().asFile
        outputFile.text = output
        println "--- System Info ---"
        println output
        println "-------------------"
        println "Info saved to: ${outputFile.absolutePath}"
    }
}
